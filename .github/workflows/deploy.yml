name: Benchmark & Deploy Web Docs

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'WIP.md'
      - 'SLOCCOUNT.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  benchmark-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Toolchains & Interpreters
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            hyperfine \
            time \
            gfortran \
            gnat \
            gnucobol \
            tcl \
            ksh \
            gawk \
            zsh \
            ruby \
            perl \
            libterm-readkey-perl \
            php-cli \
            lua5.4 \
            fish \
            fp-compiler \
            fp-units-fcl \
            fp-units-base \
            gdc \
            python-is-python3

      - name: Run CI Benchmarks & Ingest Data
        run: |
          chmod +x scripts/ci-benchmark.sh scripts/measure-telemetry.py
          ./scripts/ci-benchmark.sh

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: web
        env:
          GITHUB_ACTIONS: 'true'
          NEXT_PUBLIC_BASE_PATH: '/name-generator'
        run: npm run build

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: benchmark-and-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
